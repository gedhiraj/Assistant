<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>d25 assistant</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/static/favicon.png?v=2">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-sidebar: #141414;
      --bg-main: #0f0f0f;
      --bg-card: #181818;
      --bg-card-hover: #202020;
      --bg-input: #171717;
      --border-subtle: #262626;
      --border-strong: #333333;
      --text-primary: #ececec;
      --text-secondary: #9b9b9b;
      --text-muted: #6e6e6e;
      --accent-green: #238636;
      --accent-green-hover: #2ea043;
      --accent-blue: #2f81f7;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2e2e2e; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #424242; }

    /* Markdown & Table styling matching the video */
    .markdown-body p { margin: 0 0 12px 0; line-height: 1.6; font-size: 14px; color: #e2e2e2; }
    .markdown-body p:last-child { margin-bottom: 0; }
    .markdown-body ul, .markdown-body ol { margin: 8px 0 12px 0; padding-left: 20px; }
    .markdown-body li { margin-bottom: 6px; line-height: 1.55; font-size: 14px; color: #dcdcdc; }
    .markdown-body strong { color: #ffffff; font-weight: 600; }
    .markdown-body code {
      background: #242424;
      border: 1px solid #303030;
      padding: 1px 5px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px;
      color: #d4d4d4;
    }
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 13px;
      border: 1px solid #2b2b2b;
      border-radius: 6px;
      overflow: hidden;
    }
    .markdown-body th {
      background: #1b1b1b;
      text-align: left;
      padding: 8px 12px;
      font-weight: 600;
      color: #f0f0f0;
      border-bottom: 1px solid #2b2b2b;
    }
    .markdown-body td {
      padding: 8px 12px;
      border-bottom: 1px solid #242424;
      color: #d4d4d4;
    }
    .markdown-body tr:hover td {
      background: #1a1a1a;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin-fast { animation: spin 0.75s linear infinite; }
  </style>
</head>
<body class="flex flex-col h-screen w-screen select-none">

  <!-- Top App Window Bar (Exact Copilot Desktop Header) -->
  <header class="h-10 bg-[#141414] border-b border-[#242424] px-3 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-2.5">
      <!-- d25 Copilot-style visor mark -->
      <div class="w-5 h-5 flex items-center justify-center text-[#e6e6e6]">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a7 7 0 0 1 7 7v3a2 2 0 0 1 2 2v1.5a2.5 2.5 0 0 1-2.5 2.5h-1a3.5 3.5 0 0 1-3.5 3h-4a3.5 3.5 0 0 1-3.5-3h-1A2.5 2.5 0 0 1 3 16.5V15a2 2 0 0 1 2-2v-3a7 7 0 0 1 7-7Z"/>
          <circle cx="9.5" cy="12.5" r="1" fill="currentColor"/>
          <circle cx="14.5" cy="12.5" r="1" fill="currentColor"/>
        </svg>
      </div>
      <span class="text-xs font-medium text-[#e6e6e6] tracking-tight">d25 assistant</span>

      <div class="flex items-center gap-1 ml-2 text-[#8a8a8a]">
        <button onclick="toggleSidebar()" title="Toggle sidebar" class="p-1 rounded hover:bg-[#222222] hover:text-[#e6e6e6] transition">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path d="M2 2.5A1.5 1.5 0 0 1 3.5 1h9A1.5 1.5 0 0 1 14 2.5v11a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5v-11ZM3.5 2a.5.5 0 0 0-.5.5v11a.5.5 0 0 0 .5.5H6V2H3.5ZM7 2v12h5.5a.5.5 0 0 0 .5-.5v-11a.5.5 0 0 0-.5-.5H7Z"/>
          </svg>
        </button>
        <button onclick="startNewChat()" title="Back to Home" class="p-1 rounded hover:bg-[#222222] hover:text-[#e6e6e6] transition">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
            <path d="M9.78 12.78a.75.75 0 0 1-1.06 0L4.47 8.53a.75.75 0 0 1 0-1.06l4.25-4.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042L6.06 8l3.72 3.72a.75.75 0 0 1 0 1.06Z"/>
          </svg>
        </button>
        <button title="Forward" class="p-1 rounded hover:bg-[#222222] text-[#4a4a4a] cursor-default">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
            <path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06Z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Active Thread Title (visible during active chat like "Top issues" in video) -->
    <div id="topSessionTitle" class="text-xs font-medium text-[#b8b8b8] truncate max-w-md"></div>

    <!-- Right Quick Actions -->
    <div class="flex items-center gap-2">
      <button onclick="openPermissionsModal()" class="text-[11px] px-2 py-0.5 rounded bg-[#1d1d1d] hover:bg-[#262626] border border-[#2e2e2e] text-[#a3a3a3] hover:text-[#ececec] transition flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-[#3fb950]"></span>
        <span>Trusted (<span id="topTrustedCount">0</span>)</span>
      </button>
    </div>
  </header>

  <!-- Main 3-Pane Body -->
  <div class="flex flex-1 min-h-0 overflow-hidden">

    <!-- Left Sidebar (Exact Copilot Navigation + Projects/Sessions Tree) -->
    <aside id="sidebar" class="w-60 bg-[#141414] border-r border-[#242424] flex flex-col justify-between shrink-0">
      <div class="overflow-y-auto flex-1 py-2">
        <!-- Top Nav Links -->
        <nav class="px-2 space-y-0.5">
          <button onclick="startNewChat()" id="navHome" class="w-full flex items-center gap-2.5 px-2.5 py-1.5 rounded-md text-xs font-medium bg-[#222222] text-[#f2f2f2]">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" class="text-[#b0b0b0]">
              <path d="M6.906.664a1.749 1.749 0 0 1 2.187 0l5.25 4.2c.415.332.657.835.657 1.367v7.019A1.75 1.75 0 0 1 13.25 15h-3.5a.75.75 0 0 1-.75-.75V9H7v5.25a.75.75 0 0 1-.75.75h-3.5A1.75 1.75 0 0 1 1 13.25V6.23c0-.531.242-1.034.657-1.366l5.25-4.2Z"/>
            </svg>
            <span>Home</span>
          </button>

          <button onclick="usePrompt('Summarize my last 5 emails from Primary Inbox')" class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-md text-xs font-medium text-[#9b9b9b] hover:bg-[#1d1d1d] hover:text-[#ececec] transition">
            <span class="flex items-center gap-2.5">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                <path d="M1.75 2h12.5c.966 0 1.75.784 1.75 1.75v8.5A1.75 1.75 0 0 1 14.25 14H1.75A1.75 1.75 0 0 1 0 12.25v-8.5C0 2.784.784 2 1.75 2ZM1.5 12.251c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25V5.809L8.38 9.397a.75.75 0 0 1-.76 0L1.5 5.809v6.442Zm13-8.181v-.32a.25.25 0 0 0-.25-.25H1.75a.25.25 0 0 0-.25.25v.32L8 7.88Z"/>
              </svg>
              <span>Inbox &amp; Mail</span>
            </span>
            <span class="text-[10px] px-1.5 py-0.2 rounded bg-[#238636]/20 text-[#3fb950]">Live</span>
          </button>

          <button onclick="showUpcomingNotice('Calendar & Automations')" class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-md text-xs font-medium text-[#9b9b9b] hover:bg-[#1d1d1d] hover:text-[#ececec] transition">
            <span class="flex items-center gap-2.5">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                <path d="M4.75 0a.75.75 0 0 1 .75.75V2h5V.75a.75.75 0 0 1 1.5 0V2h1.25c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0 1 13.25 16H2.75A1.75 1.75 0 0 1 1 14.25V3.75C1 2.784 1.784 2 2.75 2H4V.75A.75.75 0 0 1 4.75 0ZM2.5 7.5v6.75c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25V7.5Zm10.75-4H2.75a.25.25 0 0 0-.25.25V6h11V3.75a.25.25 0 0 0-.25-.25Z"/>
              </svg>
              <span>Calendar</span>
            </span>
            <span class="text-[10px] text-[#6e6e6e]">Soon</span>
          </button>

          <button onclick="openPermissionsModal()" class="w-full flex items-center gap-2.5 px-2.5 py-1.5 rounded-md text-xs font-medium text-[#9b9b9b] hover:bg-[#1d1d1d] hover:text-[#ececec] transition">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3ZM1.5 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Zm13 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/>
            </svg>
            <span>Customize</span>
          </button>
        </nav>

        <!-- Workspaces Section (Replacing "Projects" in video) -->
        <div class="mt-5 px-3">
          <div class="flex items-center justify-between text-[11px] font-medium text-[#7d7d7d] mb-1.5 px-1">
            <span>Workspaces</span>
            <span class="text-[#6e6e6e]">+</span>
          </div>
          <div class="space-y-0.5 text-xs">
            <button onclick="selectWorkspaceTag('@gmail · Primary Inbox')" class="w-full flex items-center justify-between px-2 py-1.5 rounded-md text-[#dcdcdc] bg-[#1c1c1c] hover:bg-[#242424] transition">
              <span class="flex items-center gap-2 truncate">
                <span class="w-2 h-2 rounded-full bg-[#3fb950]"></span>
                <span class="truncate">Primary Inbox</span>
              </span>
              <span class="text-[10px] text-[#7d7d7d]">Active</span>
            </button>
            <button onclick="showUpcomingNotice('Google Calendar')" class="w-full flex items-center justify-between px-2 py-1.5 rounded-md text-[#8a8a8a] hover:bg-[#1a1a1a] transition">
              <span class="flex items-center gap-2 truncate">
                <span class="w-2 h-2 rounded-full bg-[#4a4a4a]"></span>
                <span class="truncate">Google Calendar</span>
              </span>
              <span class="text-[10px] text-[#5c5c5c]">Soon</span>
            </button>
            <button onclick="showUpcomingNotice('Google Drive & Docs')" class="w-full flex items-center justify-between px-2 py-1.5 rounded-md text-[#8a8a8a] hover:bg-[#1a1a1a] transition">
              <span class="flex items-center gap-2 truncate">
                <span class="w-2 h-2 rounded-full bg-[#4a4a4a]"></span>
                <span class="truncate">Google Drive</span>
              </span>
              <span class="text-[10px] text-[#5c5c5c]">Soon</span>
            </button>
            <button onclick="showUpcomingNotice('Google Sheets')" class="w-full flex items-center justify-between px-2 py-1.5 rounded-md text-[#8a8a8a] hover:bg-[#1a1a1a] transition">
              <span class="flex items-center gap-2 truncate">
                <span class="w-2 h-2 rounded-full bg-[#4a4a4a]"></span>
                <span class="truncate">Google Sheets</span>
              </span>
              <span class="text-[10px] text-[#5c5c5c]">Soon</span>
            </button>
          </div>
        </div>

        <!-- Sessions Section (Exact tree structure from video) -->
        <div class="mt-5 px-3">
          <div class="flex items-center justify-between text-[11px] font-medium text-[#7d7d7d] mb-1.5 px-1">
            <span>Sessions</span>
            <button onclick="startNewChat()" title="New session" class="hover:text-[#ececec] text-sm leading-none">+</button>
          </div>

          <div class="space-y-1">
            <div class="flex items-center gap-1.5 px-1.5 py-1 text-xs font-medium text-[#d4d4d4]">
              <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor" class="text-[#7d7d7d]">
                <path d="M12.78 5.22a.749.749 0 0 1 0 1.06l-4.25 4.25a.749.749 0 0 1-1.06 0L3.22 6.28a.749.749 0 1 1 1.06-1.06L8 8.939l3.72-3.719a.749.749 0 0 1 1.06 0Z"/>
              </svg>
              <span>d25-gmail-agent</span>
            </div>

            <div id="sessionsTree" class="pl-4 space-y-0.5">
              <div id="emptySessionLabel" class="px-2 py-1 text-[11px] text-[#6e6e6e]">No sessions yet</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Bottom User Profile Bar (Exact Copilot bottom bar) -->
      <div class="p-2.5 border-t border-[#242424] flex items-center justify-between">
        <div class="flex items-center gap-2 min-w-0">
          <div class="w-6 h-6 rounded-full bg-[#262626] border border-[#383838] flex items-center justify-center text-[10px] font-semibold text-[#ececec] shrink-0">
            DK
          </div>
          <span class="text-xs font-medium text-[#d4d4d4] truncate">Dhiraj Kumar</span>
        </div>
        <div class="flex items-center gap-1 text-[#8a8a8a]">
          <button onclick="openPermissionsModal()" title="Permissions & Trusted Users" class="p-1.5 rounded hover:bg-[#222222] hover:text-[#ececec] transition">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 0c-.69 0-1.843.265-2.928.56-1.11.3-2.229.655-2.887.87a1.54 1.54 0 0 0-1.044 1.262c-.596 4.477.787 7.795 2.465 9.99a11.777 11.777 0 0 0 2.517 2.453c.386.273.744.482 1.048.625.28.132.581.24.829.24s.548-.108.829-.24a7.159 7.159 0 0 0 1.048-.625 11.775 11.775 0 0 0 2.517-2.453c1.678-2.195 3.061-5.513 2.465-9.99a1.541 1.541 0 0 0-1.044-1.263 62.467 62.467 0 0 0-2.887-.87C9.843.266 8.69 0 8 0Z"/>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Center Chat Area -->
    <section class="flex-1 flex flex-col min-w-0 bg-[#0f0f0f] relative">

      <!-- Scrollable Conversation Feed -->
      <div id="chatScroll" class="flex-1 overflow-y-auto px-6 py-6 select-text">
        <div id="chatFeed" class="max-w-3xl mx-auto space-y-6">

          <!-- Initial Centered Copilot Hero (Shown before first prompt) -->
          <div id="homeHero" class="pt-20 pb-8 flex flex-col items-center justify-center">
            <!-- Copilot Visor Emblem -->
            <div class="mb-6 text-[#e8e8e8] opacity-90">
              <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3a7 7 0 0 1 7 7v3a2 2 0 0 1 2 2v1.5a2.5 2.5 0 0 1-2.5 2.5h-1a3.5 3.5 0 0 1-3.5 3h-4a3.5 3.5 0 0 1-3.5-3h-1A2.5 2.5 0 0 1 3 16.5V15a2 2 0 0 1 2-2v-3a7 7 0 0 1 7-7Z"/>
                <circle cx="9.5" cy="12.5" r="1.15" fill="currentColor"/>
                <circle cx="14.5" cy="12.5" r="1.15" fill="currentColor"/>
              </svg>
            </div>
          </div>

        </div>
      </div>

      <!-- Composer Container (Starts centered in Home view, docks to bottom once chat starts) -->
      <div id="composerDock" class="px-6 pb-8 pt-2 bg-[#0f0f0f] shrink-0">
        <div class="max-w-2xl mx-auto">
          <!-- Main Input Box -->
          <div class="rounded-xl bg-[#171717] border border-[#2c2c2c] focus-within:border-[#454545] transition shadow-xl">
            <textarea
              id="promptInput"
              rows="2"
              placeholder="Ask anything or summarize emails. Use @ for workspace, & for sessions..."
              class="w-full bg-transparent text-sm text-[#ececec] placeholder-[#737373] px-4 pt-3.5 pb-2 resize-none focus:outline-none max-h-40 leading-relaxed"
              onkeydown="handleKeyDown(event)"
              oninput="autoResize(this)"
            ></textarea>

            <!-- Inner Toolbar (Exact match to "+ Interactive  Copilot Fusion · Standard   [↑]") -->
            <div class="px-3 pb-2.5 pt-1 flex items-center justify-between">
              <div class="flex items-center gap-2">
                <button onclick="openPermissionsModal()" class="flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-[#222222] hover:bg-[#2a2a2a] border border-[#303030] text-xs font-medium text-[#d4d4d4] transition">
                  <span class="text-[#8a8a8a]">+</span>
                  <span>Interactive</span>
                </button>

                <span class="text-xs text-[#8a8a8a] px-1.5 py-1 rounded hover:bg-[#202020] cursor-default">
                  d25 · Gemini Flash ▾
                </span>
              </div>

              <button
                id="sendBtn"
                onclick="sendMessage()"
                title="Send prompt"
                class="w-7 h-7 rounded-md bg-[#2a2a2a] hover:bg-[#3a3a3a] disabled:opacity-40 text-[#ececec] flex items-center justify-center transition"
              >
                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                  <path d="M3.47 7.78a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0l4.25 4.25a.751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018L9 4.81v7.44a.75.75 0 0 1-1.5 0V4.81L4.53 7.78a.75.75 0 0 1-1.06 0Z"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Below-Composer Workspace Context Pills (Exact match to "github-copilot-app ▾  This computer  New worktree") -->
          <div class="mt-2.5 px-1 flex flex-wrap items-center gap-4 text-xs text-[#8a8a8a]">
            <button onclick="usePrompt('Summarize today\'s emails from my Primary Inbox with important points')" class="flex items-center gap-1.5 hover:text-[#ececec] transition">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
                <path d="M1.75 2h12.5c.966 0 1.75.784 1.75 1.75v8.5A1.75 1.75 0 0 1 14.25 14H1.75A1.75 1.75 0 0 1 0 12.25v-8.5C0 2.784.784 2 1.75 2Z"/>
              </svg>
              <span id="activeWorkspaceBadge">@gmail · Primary Inbox ▾</span>
            </button>

            <button onclick="usePrompt('Summarize my last 5 emails')" class="flex items-center gap-1.5 hover:text-[#ececec] transition">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
                <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8Z"/>
              </svg>
              <span>Last 5 emails</span>
            </button>

            <button onclick="usePrompt('Send an email to gedhiraj@gmail.com saying I checked the email automation and it is working fine, waiting for your reply')" class="flex items-center gap-1.5 hover:text-[#ececec] transition">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
                <path d="M11.013 1.427a1.75 1.75 0 0 1 2.474 0l1.086 1.086a1.75 1.75 0 0 1 0 2.474l-8.61 8.61c-.21.21-.47.364-.756.445l-3.251.93a.75.75 0 0 1-.927-.928l.929-3.25c.081-.286.235-.547.445-.758l8.61-8.61Z"/>
              </svg>
              <span>Draft email</span>
            </button>
          </div>
        </div>
      </div>

    </section>

    <!-- Right Inspector Drawer (Matches the Issue/PR details pane on the right in video) -->
    <aside id="inspectorDrawer" class="hidden w-96 bg-[#141414] border-l border-[#242424] flex flex-col shrink-0">
      <div class="h-11 px-4 border-b border-[#242424] flex items-center justify-between">
        <span id="inspectorHeaderTag" class="text-xs font-medium text-[#9b9b9b]">Email Preview</span>
        <button onclick="closeInspector()" class="text-[#8a8a8a] hover:text-[#ececec] text-xs p-1">✕</button>
      </div>
      <div id="inspectorBody" class="p-4 overflow-y-auto flex-1 space-y-4 text-xs select-text"></div>
    </aside>

  </div>

  <!-- Permissions / Customize Modal -->
  <div id="permissionsModal" class="hidden fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
    <div class="bg-[#181818] border border-[#2e2e2e] rounded-xl max-w-md w-full shadow-2xl overflow-hidden">
      <div class="px-5 py-4 border-b border-[#262626] flex items-center justify-between">
        <div>
          <h3 class="text-sm font-semibold text-[#f2f2f2]">Permissions &amp; Trusted Recipients</h3>
          <p class="text-xs text-[#8a8a8a] mt-0.5">Recipients marked "Allow Always" skip confirmation prompts.</p>
        </div>
        <button onclick="closePermissionsModal()" class="text-[#8a8a8a] hover:text-[#ececec] p-1">✕</button>
      </div>
      <div id="trustedListContainer" class="p-5 max-h-72 overflow-y-auto space-y-2"></div>
      <div class="px-5 py-3 bg-[#121212] border-t border-[#262626] flex justify-end">
        <button onclick="closePermissionsModal()" class="px-3.5 py-1.5 text-xs font-medium rounded-md bg-[#262626] hover:bg-[#323232] text-[#ececec]">
          Close
        </button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:8000";
    let sessionId = null;
    let isStreaming = false;
    let turnStartTime = null;
    let timerInterval = null;

    // Boot: load user email, trusted recipients count, and saved MongoDB sessions
    initApp();

    async function initApp() {
      await Promise.all([refreshTrustedCount(), loadSavedSessions()]);
    }

    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("hidden");
    }

    function autoResize(el) {
      el.style.height = "auto";
      el.style.height = Math.min(el.scrollHeight, 160) + "px";
    }

    function handleKeyDown(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function usePrompt(text) {
      const input = document.getElementById("promptInput");
      input.value = text;
      autoResize(input);
      sendMessage();
    }

    function selectWorkspaceTag(label) {
      document.getElementById("activeWorkspaceBadge").textContent = label + " ▾";
    }

    function showUpcomingNotice(featureName) {
      const toast = document.createElement("div");
      toast.className = "fixed bottom-5 right-5 z-50 px-4 py-2.5 rounded-lg bg-[#1c1c1c] border border-[#333333] text-xs text-[#e6e6e6] shadow-xl";
      toast.innerHTML = `<strong class="text-[#3fb950]">${featureName}</strong> integration is scheduled in Phase 2. Primary Inbox is active now.`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3200);
    }

    function startNewChat() {
      if (isStreaming) return;
      sessionId = null;
      document.getElementById("topSessionTitle").textContent = "";
      closeInspector();
      const feed = document.getElementById("chatFeed");
      feed.innerHTML = `
        <div id="homeHero" class="pt-20 pb-8 flex flex-col items-center justify-center">
          <div class="mb-6 text-[#e8e8e8] opacity-90">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3a7 7 0 0 1 7 7v3a2 2 0 0 1 2 2v1.5a2.5 2.5 0 0 1-2.5 2.5h-1a3.5 3.5 0 0 1-3.5 3h-4a3.5 3.5 0 0 1-3.5-3h-1A2.5 2.5 0 0 1 3 16.5V15a2 2 0 0 1 2-2v-3a7 7 0 0 1 7-7Z"/>
              <circle cx="9.5" cy="12.5" r="1.15" fill="currentColor"/>
              <circle cx="14.5" cy="12.5" r="1.15" fill="currentColor"/>
            </svg>
          </div>
        </div>
      `;
      loadSavedSessions();
    }

    function scrollToBottom() {
      const el = document.getElementById("chatScroll");
      el.scrollTop = el.scrollHeight;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Load & Render Saved Sessions from MongoDB
    async function loadSavedSessions() {
      try {
        const res = await fetch(`${API_BASE}/api/sessions`);
        const data = await res.json();
        const tree = document.getElementById("sessionsTree");
        const sessions = data.sessions || [];

        if (!sessions.length) {
          tree.innerHTML = `<div id="emptySessionLabel" class="px-2 py-1 text-[11px] text-[#6e6e6e]">No sessions yet</div>`;
          return;
        }

        tree.innerHTML = sessions
          .map((s) => {
            const isActive = s.session_id === sessionId;
            return `
              <div class="group flex items-center justify-between px-2 py-1.5 rounded-md ${
                isActive ? "bg-[#222222] text-[#ececec]" : "text-[#9b9b9b] hover:bg-[#1a1a1a] hover:text-[#ececec]"
              } text-xs cursor-pointer transition">
                <button onclick="openSavedSession('${s.session_id}')" class="flex items-center gap-2 min-w-0 flex-1 text-left">
                  <svg width="12" height="12" viewBox="0 0 16 16" fill="#3fb950" class="shrink-0">
                    <path d="M8 16A8 8 0 1 1 8 0a8 8 0 0 1 0 16Zm3.78-9.72a.751.751 0 0 0-.018-1.042.751.751 0 0 0-1.042-.018L6.75 9.19 5.28 7.72a.751.751 0 0 0-1.042.018.751.751 0 0 0-.018 1.042l2 2a.75.75 0 0 0 1.06 0Z"/>
                  </svg>
                  <span class="truncate">${escapeHtml(s.title)}</span>
                </button>
                <button onclick="deleteSavedSession('${s.session_id}', event)" title="Delete session" class="hidden group-hover:inline text-[#6e6e6e] hover:text-[#f85149] px-1">✕</button>
              </div>
            `;
          })
          .join("");
      } catch (_) {}
    }

    async function deleteSavedSession(targetId, ev) {
      ev.stopPropagation();
      await fetch(`${API_BASE}/api/sessions/${targetId}`, { method: "DELETE" });
      if (sessionId === targetId) {
        startNewChat();
      } else {
        loadSavedSessions();
      }
    }

    async function openSavedSession(targetId) {
      if (isStreaming) return;
      const res = await fetch(`${API_BASE}/api/sessions/${targetId}`);
      if (!res.ok) return;
      const data = await res.json();

      sessionId = targetId;
      document.getElementById("topSessionTitle").textContent = data.session.title || "";
      const feed = document.getElementById("chatFeed");
      feed.innerHTML = "";
      closeInspector();

      for (const msg of data.messages || []) {
        appendUserMessage(msg.user_message, false);
        const turnEl = renderSavedAssistantTurn(msg);
        feed.appendChild(turnEl);
      }

      scrollToBottom();
      loadSavedSessions();
    }

    function renderSavedAssistantTurn(msg) {
      const turn = document.createElement("div");
      turn.className = "space-y-3";
      const stepsHtml = (msg.steps || [])
        .map((st) => {
          const icon =
            st.status === "warning"
              ? `<svg width="13" height="13" viewBox="0 0 16 16" fill="#d29922" class="shrink-0"><path d="M6.457 1.047c.659-1.234 2.427-1.234 3.086 0l6.082 11.378A1.75 1.75 0 0 1 14.082 15H1.918a1.75 1.75 0 0 1-1.543-2.575ZM8 5a.75.75 0 0 0-.75.75v2.5a.75.75 0 0 0 1.5 0v-2.5A.75.75 0 0 0 8 5Zm1 6a1 1 0 1 0-2 0 1 1 0 0 0 2 0Z"/></svg>`
              : `<svg width="13" height="13" viewBox="0 0 16 16" fill="#3fb950" class="shrink-0"><path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"/></svg>`;
          return `
            <div class="flex items-center gap-2 text-[#b8b8b8]">
              ${icon}
              <span class="truncate">${escapeHtml(st.label)}</span>
              ${st.detail ? `<span class="text-[#6e6e6e] truncate">· ${escapeHtml(st.detail)}</span>` : ""}
            </div>
          `;
        })
        .join("");

      const approvalsHtml = (msg.approvals || [])
        .map((ap) => {
          const isEmail = ap.action_type === "send_email" || ap.action_type === "reply_to_email";
          const details = isEmail
            ? `To: <strong>${escapeHtml(ap.preview.to)}</strong> · Subject: ${escapeHtml(ap.preview.subject)}`
            : `Action: <strong>${escapeHtml(ap.preview.action)}</strong> (${ap.preview.count} email(s))`;
          return `
            <div class="rounded-lg bg-[#181818] border border-[#2a2a2a] px-3.5 py-2.5 text-xs flex items-center justify-between">
              <span class="text-[#b8b8b8] truncate">${details}</span>
              <span class="text-[11px] px-2 py-0.5 rounded bg-[#222222] text-[#3fb950] shrink-0 ml-2">${escapeHtml(ap.decision)}</span>
            </div>
          `;
        })
        .join("");

      turn.innerHTML = `
        <div class="flex items-center gap-2 text-xs text-[#8a8a8a]">
          <span class="w-2 h-2 rounded-full bg-[#3fb950]"></span>
          <span>Thought for ${msg.duration_sec || 1}s</span>
        </div>
        <div class="space-y-1.5 text-xs pl-1">${stepsHtml}</div>
        ${approvalsHtml ? `<div class="space-y-2">${approvalsHtml}</div>` : ""}
        <div class="markdown-body pt-1">${marked.parse(msg.assistant_reply || "")}</div>
      `;
      return turn;
    }

    function appendUserMessage(text, isFirstTurn = true) {
      const hero = document.getElementById("homeHero");
      if (hero) {
        hero.remove();
        if (isFirstTurn) {
          document.getElementById("topSessionTitle").textContent = text.slice(0, 42);
        }
      }

      const feed = document.getElementById("chatFeed");
      const row = document.createElement("div");
      row.className = "flex justify-end";
      row.innerHTML = `
        <div class="max-w-xl px-4 py-2.5 rounded-2xl bg-[#222222] border border-[#2e2e2e] text-sm text-[#f0f0f0] leading-relaxed whitespace-pre-wrap">
          ${escapeHtml(text)}
        </div>
      `;
      feed.appendChild(row);
      scrollToBottom();
    }

    function createAssistantTurn() {
      const feed = document.getElementById("chatFeed");
      const turn = document.createElement("div");
      turn.className = "space-y-3";
      turn.innerHTML = `
        <div class="flex items-center gap-2 text-xs text-[#8a8a8a]">
          <span class="timer-dot w-2 h-2 rounded-full bg-[#3fb950] animate-pulse"></span>
          <span class="timer-label">0s</span>
        </div>
        <div class="steps-list space-y-1.5 text-xs pl-1"></div>
        <div class="approvals-slot space-y-3"></div>
        <div class="reply-slot markdown-body hidden pt-1"></div>
      `;
      feed.appendChild(turn);

      turnStartTime = Date.now();
      const timerLabel = turn.querySelector(".timer-label");
      timerInterval = setInterval(() => {
        const secs = Math.floor((Date.now() - turnStartTime) / 1000);
        timerLabel.textContent = `${secs}s`;
      }, 500);

      scrollToBottom();
      return turn;
    }

    function finishTurnTimer(turnEl) {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      const secs = Math.max(1, Math.floor((Date.now() - turnStartTime) / 1000));
      const dot = turnEl.querySelector(".timer-dot");
      const label = turnEl.querySelector(".timer-label");
      if (dot) dot.classList.remove("animate-pulse");
      if (label) label.textContent = `Thought for ${secs}s`;
    }

    function upsertStep(turnEl, step) {
      const list = turnEl.querySelector(".steps-list");
      let row = list.querySelector(`[data-step-id="${step.id}"]`);

      let iconHtml = "";
      if (step.status === "running") {
        iconHtml = `<span class="w-3 h-3 rounded-full border-2 border-[#9b9b9b] border-t-transparent animate-spin-fast inline-block shrink-0"></span>`;
      } else if (step.status === "completed") {
        iconHtml = `<svg width="13" height="13" viewBox="0 0 16 16" fill="#3fb950" class="shrink-0"><path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"/></svg>`;
      } else {
        iconHtml = `<svg width="13" height="13" viewBox="0 0 16 16" fill="#d29922" class="shrink-0"><path d="M6.457 1.047c.659-1.234 2.427-1.234 3.086 0l6.082 11.378A1.75 1.75 0 0 1 14.082 15H1.918a1.75 1.75 0 0 1-1.543-2.575ZM8 5a.75.75 0 0 0-.75.75v2.5a.75.75 0 0 0 1.5 0v-2.5A.75.75 0 0 0 8 5Zm1 6a1 1 0 1 0-2 0 1 1 0 0 0 2 0Z"/></svg>`;
      }

      const contentHtml = `
        <div class="flex items-center gap-2 text-[#b8b8b8]">
          ${iconHtml}
          <span class="truncate">${escapeHtml(step.label)}</span>
          ${step.detail ? `<span class="text-[#6e6e6e] truncate">· ${escapeHtml(step.detail)}</span>` : ""}
        </div>
      `;

      if (!row) {
        row = document.createElement("div");
        row.setAttribute("data-step-id", step.id);
        list.appendChild(row);
      }
      row.innerHTML = contentHtml;
      scrollToBottom();
    }

    function renderApprovalCard(turnEl, data) {
      const slot = turnEl.querySelector(".approvals-slot");
      const card = document.createElement("div");
      card.id = `approval-${data.approval_id}`;
      card.className = "rounded-xl bg-[#181818] border border-[#2e2e2e] overflow-hidden shadow-lg";

      const isEmail = data.action_type === "send_email" || data.action_type === "reply_to_email";
      const headerLabel =
        data.action_type === "send_email"
          ? "Review email draft"
          : data.action_type === "reply_to_email"
          ? "Review thread reply"
          : `Review action (${data.preview.action})`;

      if (isEmail) {
        openInspector(data.preview.subject, data.preview.to, data.preview.body, data.preview.signature);
      }

      const summaryBlock = isEmail
        ? `
          <div class="p-4 border-b border-[#262626] space-y-2 text-xs">
            <div class="flex items-center justify-between">
              <span class="text-[#8a8a8a]">To: <strong class="text-[#ececec]">${escapeHtml(data.preview.to)}</strong></span>
              <button onclick='openInspector(${JSON.stringify(data.preview.subject)}, ${JSON.stringify(data.preview.to)}, ${JSON.stringify(data.preview.body)}, ${JSON.stringify(data.preview.signature)})' class="text-[#8a8a8a] hover:text-[#ececec] flex items-center gap-1">
                <span>View preview</span>
                <span>↗</span>
              </button>
            </div>
            <div class="text-[#8a8a8a]">Subject: <span class="text-[#ececec]">${escapeHtml(data.preview.subject)}</span></div>
            <div class="mt-2 p-3 rounded-lg bg-[#121212] border border-[#262626] text-[#dcdcdc] whitespace-pre-wrap leading-relaxed">${escapeHtml(data.preview.body)}\n\n<strong class="text-[#ffffff]">${escapeHtml(data.preview.signature)}</strong></div>
          </div>
        `
        : `
          <div class="p-4 border-b border-[#262626] text-xs text-[#dcdcdc]">
            Confirm <strong>${escapeHtml(data.preview.action)}</strong> on <strong>${data.preview.count}</strong> email(s).
          </div>
        `;

      card.innerHTML = `
        <div class="px-4 py-2.5 bg-[#1c1c1c] border-b border-[#262626] flex items-center justify-between">
          <span class="text-xs font-semibold text-[#ececec]">${headerLabel}</span>
          <span class="text-[11px] text-[#3fb950] font-medium">Permission required</span>
        </div>
        ${summaryBlock}
        <div class="approval-options divide-y divide-[#242424] text-xs">
          <button onclick="submitApproval('${data.approval_id}', 'allow_once')" class="w-full px-4 py-2.5 text-left hover:bg-[#222222] transition flex items-center gap-3 text-[#ececec]">
            <span class="text-[#7d7d7d] font-mono">1.</span>
            <span>Allow once and send now</span>
          </button>
          ${
            data.recipient
              ? `<button onclick="submitApproval('${data.approval_id}', 'allow_always')" class="w-full px-4 py-2.5 text-left hover:bg-[#222222] transition flex items-center gap-3 text-[#ececec]">
                   <span class="text-[#7d7d7d] font-mono">2.</span>
                   <span>Allow always for <strong>${escapeHtml(data.recipient)}</strong></span>
                 </button>`
              : ""
          }
          <button onclick="submitApproval('${data.approval_id}', 'deny')" class="w-full px-4 py-2.5 text-left hover:bg-[#222222] transition flex items-center gap-3 text-[#9b9b9b]">
            <span class="text-[#7d7d7d] font-mono">${data.recipient ? "3." : "2."}</span>
            <span>Cancel and keep as draft</span>
          </button>
        </div>
        <div class="approval-footer px-4 py-2.5 bg-[#141414] border-t border-[#262626] flex items-center justify-end gap-2">
          <button onclick="submitApproval('${data.approval_id}', 'deny')" class="px-3 py-1 rounded-md bg-[#222222] hover:bg-[#2c2c2c] border border-[#333333] text-xs text-[#d4d4d4] transition">
            Cancel <span class="text-[10px] text-[#7d7d7d] ml-1">Esc</span>
          </button>
          <button onclick="submitApproval('${data.approval_id}', 'allow_once')" class="px-3 py-1 rounded-md bg-[#238636] hover:bg-[#2ea043] text-xs font-medium text-white transition">
            Approve &amp; send <span class="text-[10px] opacity-80 ml-1">↵</span>
          </button>
        </div>
      `;

      slot.appendChild(card);
      scrollToBottom();
    }

    async function submitApproval(approvalId, decision) {
      const card = document.getElementById(`approval-${approvalId}`);
      if (card) {
        const options = card.querySelector(".approval-options");
        const footer = card.querySelector(".approval-footer");
        const statusText =
          decision === "allow_once"
            ? "Approved (Allow once)"
            : decision === "allow_always"
            ? "Approved (Allow always saved to MongoDB)"
            : "Cancelled by user";
        if (options) options.remove();
        if (footer) {
          footer.innerHTML = `<span class="text-xs text-[#8a8a8a]">Status: <strong class="text-[#ececec]">${statusText}</strong></span>`;
        }
      }

      await fetch(`${API_BASE}/api/approve`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ approval_id: approvalId, decision }),
      });

      if (decision === "allow_always") {
        refreshTrustedCount();
      }
    }

    function openInspector(subject, recipient, body, signature) {
      const drawer = document.getElementById("inspectorDrawer");
      const content = document.getElementById("inspectorBody");
      drawer.classList.remove("hidden");
      content.innerHTML = `
        <div class="space-y-3">
          <h2 class="text-base font-semibold text-[#f2f2f2] leading-snug">${escapeHtml(subject)}</h2>
          <div class="flex items-center gap-2">
            <span class="px-2 py-0.5 rounded-full bg-[#238636]/20 text-[#3fb950] border border-[#238636]/40 text-[11px] font-medium">Draft Ready</span>
            <span class="text-[#8a8a8a]">to ${escapeHtml(recipient)}</span>
          </div>
          <div class="pt-3 border-t border-[#262626] space-y-2">
            <div class="text-[11px] font-semibold uppercase tracking-wider text-[#7d7d7d]">Editorial HTML Preview</div>
            <div class="rounded-lg bg-white text-[#1f2328] p-6 shadow-inner font-sans text-sm leading-relaxed">
              <div class="whitespace-pre-wrap">${escapeHtml(body)}</div>
              <div class="mt-6 font-semibold text-[#111827]">${escapeHtml(signature)}</div>
            </div>
          </div>
        </div>
      `;
    }

    function closeInspector() {
      document.getElementById("inspectorDrawer").classList.add("hidden");
    }

    async function sendMessage() {
      if (isStreaming) return;
      const input = document.getElementById("promptInput");
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      autoResize(input);
      isStreaming = true;
      document.getElementById("sendBtn").disabled = true;

      appendUserMessage(text, !sessionId);
      const turnEl = createAssistantTurn();

      try {
        const response = await fetch(`${API_BASE}/api/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message: text }),
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const events = buffer.split("\n\n");
          buffer = events.pop();

          for (const rawEvent of events) {
            if (!rawEvent.startsWith("data: ")) continue;
            const payload = JSON.parse(rawEvent.slice(6));

            if (payload.type === "session") {
              sessionId = payload.session_id;
            } else if (payload.type === "step") {
              upsertStep(turnEl, payload);
            } else if (payload.type === "approval_required") {
              renderApprovalCard(turnEl, payload);
            } else if (payload.type === "message") {
              const replySlot = turnEl.querySelector(".reply-slot");
              replySlot.classList.remove("hidden");
              replySlot.innerHTML = marked.parse(payload.text || "");
              scrollToBottom();
            } else if (payload.type === "error") {
              const replySlot = turnEl.querySelector(".reply-slot");
              replySlot.classList.remove("hidden");
              replySlot.innerHTML = `<div class="p-3 rounded-lg bg-[#da3633]/10 border border-[#f85149]/40 text-xs text-[#ff7b72]">${escapeHtml(payload.message)}</div>`;
              scrollToBottom();
            }
          }
        }
      } catch (err) {
        const replySlot = turnEl.querySelector(".reply-slot");
        replySlot.classList.remove("hidden");
        replySlot.innerHTML = `<div class="p-3 rounded-lg bg-[#da3633]/10 border border-[#f85149]/40 text-xs text-[#ff7b72]">Backend connection error: ${escapeHtml(err.message)}</div>`;
      } finally {
        finishTurnTimer(turnEl);
        isStreaming = false;
        document.getElementById("sendBtn").disabled = false;
        await loadSavedSessions();
        input.focus();
      }
    }

    async function refreshTrustedCount() {
      try {
        const res = await fetch(`${API_BASE}/api/permissions`);
        const data = await res.json();
        document.getElementById("topTrustedCount").textContent = (data.allowed_recipients || []).length;
      } catch (_) {}
    }

    async function openPermissionsModal() {
      const modal = document.getElementById("permissionsModal");
      const container = document.getElementById("trustedListContainer");
      modal.classList.remove("hidden");
      container.innerHTML = `<div class="text-xs text-[#8a8a8a]">Loading from MongoDB...</div>`;

      const res = await fetch(`${API_BASE}/api/permissions`);
      const data = await res.json();
      const list = data.allowed_recipients || [];

      if (!list.length) {
        container.innerHTML = `<div class="text-xs text-[#8a8a8a] py-4 text-center">No trusted recipients saved in MongoDB yet. Select "Allow always" on any draft to save one.</div>`;
        return;
      }

      container.innerHTML = list
        .map(
          (email) => `
          <div class="flex items-center justify-between px-3 py-2 rounded-lg bg-[#121212] border border-[#2a2a2a]">
            <span class="text-xs text-[#ececec] font-medium">${escapeHtml(email)}</span>
            <button onclick="revokeRecipient('${escapeHtml(email)}')" class="text-xs text-[#f85149] hover:underline">Revoke</button>
          </div>
        `
        )
        .join("");
    }

    function closePermissionsModal() {
      document.getElementById("permissionsModal").classList.add("hidden");
    }

    async function revokeRecipient(email) {
      await fetch(`${API_BASE}/api/permissions/${encodeURIComponent(email)}`, { method: "DELETE" });
      await openPermissionsModal();
      await refreshTrustedCount();
    }
  </script>
</body>
</html>
